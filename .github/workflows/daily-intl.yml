name: 国内与国际工作台每周同步

on:
  schedule:
    # 北京时间每周三、周五 22:00（UTC 14:00）
    - cron: '0 14 * * 3,5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-intl.yml'
      - 'tools/cn_cloud_sync.py'
      - 'workbench/build_workbench.py'
      - 'workbench/ingest_vdts_clinical.py'

permissions:
  contents: write

concurrency:
  group: veterinary-drug-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      REGULATORY_TIMEOUT: '60'
      EMA_MAX_PAGES: '40'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 同步国内与国际官方数据源
        shell: bash
        run: |
          set +e
          python daily_sync.py --json
          intl_status=$?
          python tools/cn_cloud_sync.py
          cn_status=$?
          set -e

          if [ "$cn_status" -ne 0 ]; then
            git restore --source=HEAD --staged --worktree -- workbench
          fi

          python tools/append_changelog.py || true

          echo "international_status=$intl_status"
          echo "domestic_status=$cn_status"
          if [ "$intl_status" -ne 0 ] && [ "$cn_status" -ne 0 ]; then
            echo "国内、国际同步均失败，本次不发布旧数据"
            exit 1
          fi
      - name: 提交数据、网页和变更日志
        shell: bash
        run: |
          git config user.name "qqkiky"
          git config user.email "qqkiky@users.noreply.github.com"
          git add data dist static workbench docs
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: 工作台定时同步 $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main
