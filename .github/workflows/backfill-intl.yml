name: 国际工作台全量回填（维护用）

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 全量重抓 USDA + EMA（约 30 分钟）
        run: |
          rm -f data/vet_biologics.db
          python daily_sync.py --json
        env:
          REPLACE_ON_LIVE: "1"
          EMA_MAX_PAGES: "510"
          EMA_PAGE_DELAY: "1.0"
          EMA_MAX_RETRIES: "8"
          REGULATORY_TIMEOUT: "60"
      - name: 提交并推送
        run: |
          git config user.name "qqkiky"
          git config user.email "qqkiky@users.noreply.github.com"
          git add data dist static tools docs
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore(intl): 全量回填 $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: 组装站点
        run: python publish_site.py
      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 发布到 GitHub Pages
        uses: actions/deploy-pages@v4
