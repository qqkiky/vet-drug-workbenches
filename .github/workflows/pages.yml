name: 部署静态网站 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["国内与国际工作台每周同步"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 组装站点（国际 / 国内）
        run: python publish_site.py
      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 发布到 GitHub Pages
        uses: actions/deploy-pages@v4
